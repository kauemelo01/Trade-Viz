<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trade-Viz</title>
  <meta name="description" content="Trade-Viz — live P&amp;L, win rate and latency of the trading bot">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#15803d" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1117" media="(prefers-color-scheme: dark)">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Trade-Viz">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <style>
    html, body { margin: 0; height: 100%; background: #fff; }
    body { display: flex; flex-direction: column; height: 100dvh;
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

    #install-bar { display: none; align-items: center; gap: .5rem; padding: .45rem .75rem;
                   background: linear-gradient(135deg, #14532d 0%, #16a34a 100%); color: #fff;
                   font-size: .9rem; }
    #install-bar.show { display: flex; }
    #install-bar span { flex: 1; }
    #install-btn { border: 0; border-radius: 999px; padding: .4rem .9rem; font: inherit;
                   font-weight: 600; background: #fff; color: #14532d; cursor: pointer; }
    #install-close { border: 0; background: none; color: #fff; font-size: 1.1rem;
                     padding: .2rem .4rem; cursor: pointer; }

    #ios-help { display: none; padding: .6rem .9rem .8rem; background: #f0fdf4; color: #212121;
                font-size: .9rem; border-bottom: 1px solid #bbf7d0; }
    #ios-help.show { display: block; }
    #ios-help ol { margin: .3rem 0 0; padding-left: 1.2rem; }

    /* The app is drawn at a desktop width and scaled down to fit (see the script),
       so phones get the desktop layout instead of Streamlit's stacked mobile one. */
    #frame { flex: 1; position: relative; overflow: hidden; }
    iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;
             display: block; background: transparent; transform-origin: 0 0; }

    /* Same background as Streamlit's dark theme, so no white edge shows around the app. */
    @media (prefers-color-scheme: dark) {
      html, body { background: #0e1117; }
      #ios-help { background: #12241a; color: #dcfce7; border-bottom-color: #166534; }
    }
  </style>
</head>
<body>
  <div id="install-bar" role="region" aria-label="Install the app">
    <span>Use it as an app on your phone</span>
    <button id="install-btn" type="button">📲 Install app</button>
    <button id="install-close" type="button" aria-label="Close">✕</button>
  </div>
  <div id="ios-help">
    <strong>On iPhone / iPad (Safari):</strong>
    <ol>
      <li>Tap <strong>Share</strong> (the square with the arrow ⬆️).</li>
      <li>Choose <strong>Add to Home Screen</strong>, then tap <strong>Add</strong>.</li>
    </ol>
  </div>

  <div id="frame">
    <iframe src="https://trade-viz-deriv-rd.streamlit.app/~/+/?embed=true"
            title="Trade-Viz" allow="clipboard-write"></iframe>
  </div>

  <script>
    // Desktop version by default: on screens narrower than DESKTOP_WIDTH, lay the app
    // out at DESKTOP_WIDTH and scale it down to fit. Wider screens are left as they are.
    (function () {
      var DESKTOP_WIDTH = 1024;
      var frame = document.getElementById("frame");
      var iframe = frame.querySelector("iframe");
      function fit() {
        var w = frame.clientWidth, h = frame.clientHeight;
        if (w >= DESKTOP_WIDTH) {
          iframe.style.width = iframe.style.height = iframe.style.transform = "";
          return;
        }
        var s = w / DESKTOP_WIDTH;
        iframe.style.width = DESKTOP_WIDTH + "px";
        iframe.style.height = (h / s) + "px";
        iframe.style.transform = "scale(" + s + ")";
      }
      fit();
      window.addEventListener("resize", fit);
      if (window.ResizeObserver) new ResizeObserver(fit).observe(frame);
    })();

    (function () {
      var bar = document.getElementById("install-bar");
      var btn = document.getElementById("install-btn");
      var help = document.getElementById("ios-help");
      var KEY = "pwa-install-dismissed";

      var ua = navigator.userAgent;
      var isIOS = /iPhone|iPad|iPod/.test(ua);
      var isAndroid = /Android/.test(ua);
      var installed = window.matchMedia("(display-mode: fullscreen)").matches ||
                    window.matchMedia("(display-mode: standalone)").matches ||
                      window.navigator.standalone === true;
      var dismissed = false;
      try { dismissed = localStorage.getItem(KEY) === "1"; } catch (e) {}

      // Phones only, outside the installed app, and only if the user has not closed the bar.
      var eligible = (isIOS || isAndroid) && !installed && !dismissed;
      var deferred = null;

      function hide() { bar.classList.remove("show"); help.classList.remove("show"); }

      // Android/Chrome: keep the install prompt and show the button.
      window.addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault();
        deferred = e;
        if (eligible && isAndroid) bar.classList.add("show");
      });
      window.addEventListener("appinstalled", hide);

      // iPhone: installing from code is not possible; the button shows the steps.
      if (eligible && isIOS) bar.classList.add("show");

      btn.addEventListener("click", function () {
        if (deferred) {
          deferred.prompt();
          deferred.userChoice.then(function (r) {
            if (r.outcome === "accepted") hide();
            deferred = null;
          });
        } else if (isIOS) {
          help.classList.toggle("show");
        }
      });

      document.getElementById("install-close").addEventListener("click", function () {
        hide();
        try { localStorage.setItem(KEY, "1"); } catch (e) {}
      });

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      }
    })();
  </script>
</body>
</html>
